name: Daily Surfline Fetch

on:
  schedule:
    # Runs at 3:30 AM UTC every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows you to manually trigger it via the GitHub Actions tab

jobs:
  update-surf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run Fetch Script
        run: python fetch_surf.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add surf.json
          # Only commit if the file actually changed
          git commit -m "Auto-update surf forecast" || exit 0
          git push
